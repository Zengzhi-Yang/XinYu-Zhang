<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>二氧化碳杂化过程 3D 交互模型</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 250px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            border: 1px solid #e0e0e0;
        }
        .panel-header { font-weight: bold; font-size: 16px; margin-bottom: 15px; display: flex; justify-content: space-between;}
        
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-light { background: #f0f0f0; color: #333; }
        .btn-dark { background: #1a1e29; color: white; }
        .btn-dark:hover { background: #2c3245; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .slider-container { margin-top: 15px; }
        .slider-container label { font-size: 13px; color: #555; }
        .slider-row { display: flex; align-items: center; margin-top: 10px; }
        input[type=range] { flex-grow: 1; margin-right: 10px; }
        #progress-text { font-size: 13px; font-weight: bold; }
        #controls-hint { position: absolute; bottom: 20px; left: 20px; color: #555; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; font-size: 13px; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="control-panel">
        <div class="panel-header"><span>二氧化碳的杂化</span><span>−</span></div>
        <button class="btn-light" id="btn-reset">上一步 / 重置</button>
        <button class="btn-dark" id="btn-excite">激发</button>
        <button class="btn-dark" id="btn-hybridize" disabled>杂化</button>
        <button class="btn-dark" id="btn-sigma" disabled>形成Sigma键</button>
        <button class="btn-dark" id="btn-pi1" disabled>形成π键 (第1次)</button>
        <button class="btn-dark" id="btn-pi2" disabled>形成π键 (第2次)</button>
        
        <div class="slider-container">
            <label>氧原子靠近进度</label>
            <div class="slider-row">
                <input type="range" id="approach-slider" min="0" max="100" value="0">
                <span id="progress-text">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="controls-hint">操作提示：左键拖动旋转视角 | 按住ctrl+左键平移位置 | 滚轮缩放大小</div>

    <script>
        // ================= 场景初始化 =================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 6, 38);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // ================= 材质定义 =================
        const colorS = 0xffe600;  
        const colorPx = 0x00ffff; 
        const colorPy = 0xff00ff; 
        const colorPz = 0xff4400; 
        const colorSp = 0x33ff33; 

        function createCloudMat(color) {
            return new THREE.MeshPhysicalMaterial({
                color: color, transmission: 0.6, opacity: 0.8, transparent: true,
                roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false
            });
        }
        
        const matNucleusC = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const matNucleusO = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
        const matElec = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.1, metalness: 0.8 });
        
        const cMat = { s: createCloudMat(colorS), px: createCloudMat(colorPx), py: createCloudMat(colorPy), pz: createCloudMat(colorPz), sp: createCloudMat(colorSp) };
        const oLMat = { px: createCloudMat(colorPx), py: createCloudMat(colorPy), pz: createCloudMat(colorPz) };
        const oRMat = { px: createCloudMat(colorPx), py: createCloudMat(colorPy), pz: createCloudMat(colorPz) };
        
        const sigmaLMat = createCloudMat(colorSp); sigmaLMat.opacity = 0;
        const sigmaRMat = createCloudMat(colorSp); sigmaRMat.opacity = 0;
        const piVertMat = createCloudMat(colorPy); piVertMat.opacity = 0;
        const piHorizMat = createCloudMat(colorPz); piHorizMat.opacity = 0;

        // ================= 对象创建函数 =================
        function createLobe(material, position, rotation, isSp = false) {
            const geo = new THREE.SphereGeometry(1.2, 32, 32);
            geo.scale(isSp ? 0.4 : 0.5, isSp ? 1.8 : 2.0, isSp ? 0.4 : 0.5);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.copy(position);
            mesh.rotation.set(rotation.x, rotation.y, rotation.z);
            return mesh;
        }

        function createElectron(position) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 24), matElec);
            mesh.position.copy(position);
            return mesh;
        }

        const carbonGroup = new THREE.Group();
        const oxyLeftGroup = new THREE.Group();
        const oxyRightGroup = new THREE.Group();
        scene.add(carbonGroup, oxyLeftGroup, oxyRightGroup);

        oxyLeftGroup.position.x = -12;
        oxyRightGroup.position.x = 12;

        const lobeDist = 2.4; 
        const elecDist = 1.8; 

        // ================= 1. 构建碳原子 (C) =================
        carbonGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), matNucleusC));
        
        const c2sLobe = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 32), cMat.s);
        carbonGroup.add(c2sLobe);
        const cElec2s_1 = createElectron(new THREE.Vector3(0.5, 0.4, 0));
        const cElec2s_2 = createElectron(new THREE.Vector3(-0.5, -0.4, 0));
        carbonGroup.add(cElec2s_1, cElec2s_2);

        const cPxLobe1 = createLobe(cMat.px, new THREE.Vector3(lobeDist, 0, 0), new THREE.Vector3(0, 0, Math.PI/2));
        const cPxLobe2 = createLobe(cMat.px, new THREE.Vector3(-lobeDist, 0, 0), new THREE.Vector3(0, 0, Math.PI/2));
        carbonGroup.add(cPxLobe1, cPxLobe2);
        const cElecPx = createElectron(new THREE.Vector3(elecDist, 0, 0));
        carbonGroup.add(cElecPx);

        const cPyLobe1 = createLobe(cMat.py, new THREE.Vector3(0, lobeDist, 0), new THREE.Vector3(0, 0, 0));
        const cPyLobe2 = createLobe(cMat.py, new THREE.Vector3(0, -lobeDist, 0), new THREE.Vector3(0, 0, 0));
        carbonGroup.add(cPyLobe1, cPyLobe2);
        const cElecPy = createElectron(new THREE.Vector3(0, -elecDist, 0)); 
        carbonGroup.add(cElecPy);

        const cPzLobe1 = createLobe(cMat.pz, new THREE.Vector3(0, 0, lobeDist), new THREE.Vector3(Math.PI/2, 0, 0));
        const cPzLobe2 = createLobe(cMat.pz, new THREE.Vector3(0, 0, -lobeDist), new THREE.Vector3(Math.PI/2, 0, 0));
        carbonGroup.add(cPzLobe1, cPzLobe2);

        const cSpLobeLeft = createLobe(cMat.sp, new THREE.Vector3(-1.4, 0, 0), new THREE.Vector3(0, 0, Math.PI/2), true);
        const cSpLobeRight = createLobe(cMat.sp, new THREE.Vector3(1.4, 0, 0), new THREE.Vector3(0, 0, Math.PI/2), true);
        cSpLobeLeft.visible = false; cSpLobeRight.visible = false; cMat.sp.opacity = 0;
        carbonGroup.add(cSpLobeLeft, cSpLobeRight);

        // ================= 2. 构建氧原子 (O) =================
        function buildOxygen(group, isLeft, mats) {
            group.add(new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), matNucleusO));
            const dir = isLeft ? 1 : -1;

            const px1 = createLobe(mats.px, new THREE.Vector3(lobeDist, 0, 0), new THREE.Vector3(0, 0, Math.PI/2));
            const px2 = createLobe(mats.px, new THREE.Vector3(-lobeDist, 0, 0), new THREE.Vector3(0, 0, Math.PI/2));
            group.add(px1, px2);
            const elecPx = createElectron(new THREE.Vector3(elecDist * dir, 0, 0)); 
            group.add(elecPx);

            const py1 = createLobe(mats.py, new THREE.Vector3(0, lobeDist, 0), new THREE.Vector3(0, 0, 0));
            const py2 = createLobe(mats.py, new THREE.Vector3(0, -lobeDist, 0), new THREE.Vector3(0, 0, 0));
            group.add(py1, py2);
            
            const pz1 = createLobe(mats.pz, new THREE.Vector3(0, 0, lobeDist), new THREE.Vector3(Math.PI/2, 0, 0));
            const pz2 = createLobe(mats.pz, new THREE.Vector3(0, 0, -lobeDist), new THREE.Vector3(Math.PI/2, 0, 0));
            group.add(pz1, pz2);

            let e_py1, e_py2, e_pz1, e_pz2;
            if (isLeft) { 
                e_py1 = createElectron(new THREE.Vector3(0, elecDist, 0));
                e_pz1 = createElectron(new THREE.Vector3(0, 0, elecDist));  // 前侧
                e_pz2 = createElectron(new THREE.Vector3(0, 0, -elecDist)); // 后侧
                group.add(e_py1, e_pz1, e_pz2);
            } else { 
                e_pz1 = createElectron(new THREE.Vector3(0, 0, elecDist));  // 起初在右侧前伸轨道(前侧)
                e_py1 = createElectron(new THREE.Vector3(0, elecDist, 0));
                e_py2 = createElectron(new THREE.Vector3(0, -elecDist, 0));
                group.add(e_pz1, e_py1, e_py2);
            }
            return { elecPx, e_py1, e_py2, e_pz1, e_pz2 };
        }
        
        const oLeftOrbits = buildOxygen(oxyLeftGroup, true, oLMat);
        const oRightOrbits = buildOxygen(oxyRightGroup, false, oRMat);

        // ================= 3. 构建键云 =================
        const sigmaGeo = new THREE.SphereGeometry(1.2, 32, 32);
        sigmaGeo.scale(0.8, 2.0, 0.8); 
        
        const sigmaLeft = new THREE.Mesh(sigmaGeo, sigmaLMat);
        sigmaLeft.rotation.z = Math.PI/2; sigmaLeft.position.x = -1.8;
        sigmaLeft.visible = false;
        
        const sigmaRight = new THREE.Mesh(sigmaGeo, sigmaRMat);
        sigmaRight.rotation.z = Math.PI/2; sigmaRight.position.x = 1.8;
        sigmaRight.visible = false; 
        carbonGroup.add(sigmaLeft, sigmaRight);
        
        // 创建扁平化(约120度)的大离域 π 键云
        function createBananaBond(material, rotation) {
            const bondGroup = new THREE.Group();
            
            // 使用贝塞尔曲线使轨道跨越左右氧原子，且高度适当（4.2相当于中等曲率）
            const curveTop = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-3.6, 0, 0),
                new THREE.Vector3(0, 8.4, 0), // 调整控制点使得中点最高处约为4.2
                new THREE.Vector3(3.6, 0, 0)
            );
            const curveBottom = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-3.6, 0, 0),
                new THREE.Vector3(0, -8.4, 0),
                new THREE.Vector3(3.6, 0, 0)
            );
            
            const topBond = new THREE.Mesh(new THREE.TubeGeometry(curveTop, 64, 0.7, 16, false), material);
            const bottomBond = new THREE.Mesh(new THREE.TubeGeometry(curveBottom, 64, 0.7, 16, false), material);
            
            bondGroup.add(topBond, bottomBond);
            bondGroup.rotation.copy(rotation);
            bondGroup.visible = false;
            carbonGroup.add(bondGroup);
            return bondGroup;
        }

        const piBondVertical = createBananaBond(piVertMat, new THREE.Euler(0, 0, 0));
        const piBondHorizontal = createBananaBond(piHorizMat, new THREE.Euler(Math.PI / 2, 0, 0));


        // ================= UI 交互逻辑 (引入步骤状态机) =================
        let currentStep = 0; // 0:初始, 1:激发, 2:杂化, 3:Sigma, 4:Pi1, 5:Pi2
        
        const btnReset = document.getElementById('btn-reset');
        const btnExcite = document.getElementById('btn-excite');
        const btnHybridize = document.getElementById('btn-hybridize');
        const slider = document.getElementById('approach-slider');
        const textProgress = document.getElementById('progress-text');
        const btnSigma = document.getElementById('btn-sigma');
        const btnPi1 = document.getElementById('btn-pi1');
        const btnPi2 = document.getElementById('btn-pi2');

        btnExcite.addEventListener('click', () => {
            currentStep = 1;
            gsap.to(cElec2s_2.position, { x: 0, y: 0, z: elecDist, duration: 1.5, ease: "power2.inOut",
                onComplete: () => { btnExcite.disabled = true; btnHybridize.disabled = false; }
            });
        });

        btnHybridize.addEventListener('click', () => {
            currentStep = 2;
            gsap.to([cMat.s, cMat.px], { opacity: 0, duration: 1, onComplete: () => {
                c2sLobe.visible = false; cPxLobe1.visible = false; cPxLobe2.visible = false;
            }});
            
            cSpLobeLeft.visible = true; cSpLobeRight.visible = true;
            gsap.to(cMat.sp, { opacity: 0.8, duration: 1 });
            
            gsap.to(cElec2s_1.position, { x: -1.4, y: 0, z: 0, duration: 1});
            gsap.to(cElecPx.position, { x: 1.4, y: 0, z: 0, duration: 1});
            btnHybridize.disabled = true;
            if (slider.value == 100) btnSigma.disabled = false;
        });

        slider.addEventListener('input', (e) => {
            if (currentStep >= 3) {
                e.target.value = 100; // 形成Sigma键后锁定滑块
                return;
            }
            const val = e.target.value;
            textProgress.innerText = val + '%';
            const targetX = 12 - (val / 100) * (12 - 3.6); 
            oxyLeftGroup.position.x = -targetX;
            oxyRightGroup.position.x = targetX;

            if (val == 100) btnSigma.disabled = btnHybridize.disabled ? false : true;
            else btnSigma.disabled = true;
        });

        btnSigma.addEventListener('click', () => {
            currentStep = 3;
            gsap.to([cMat.sp, oLMat.px, oRMat.px], { opacity: 0, duration: 1 });
            
            sigmaLeft.visible = true; sigmaRight.visible = true;
            gsap.to([sigmaLMat, sigmaRMat], { opacity: 0.9, duration: 1.5 });
            
            // 将电子移动入绿色的Sigma云内，设置 Y 偏移量使其上下成对
            gsap.to(cElec2s_1.position, {x: -1.8, y: 0.25, z: 0, duration: 1});
            gsap.to(oLeftOrbits.elecPx.position, {x: 1.8, y: -0.25, z: 0, duration: 1}); // local x=1.8 -> world x=-1.8
            
            gsap.to(cElecPx.position, {x: 1.8, y: 0.25, z: 0, duration: 1});
            gsap.to(oRightOrbits.elecPx.position, {x: -1.8, y: -0.25, z: 0, duration: 1});
            
            // 【要求2】将右端氧原子前伸的p轨道(红)上的电子后移
            gsap.to(oRightOrbits.e_pz1.position, {z: -elecDist, duration: 1.5});

            btnSigma.disabled = true; btnPi1.disabled = false;
        });

        btnPi1.addEventListener('click', () => {
            currentStep = 4;
            // 三个原子的 Py 轨道全部消失，形成离域大π键
            gsap.to([cMat.py, oLMat.py, oRMat.py], { opacity: 0, duration: 1 });
            
            piBondVertical.visible = true;
            gsap.to(piVertMat, { opacity: 0.85, duration: 1.5 });

            // 4个原Py电子分别进入上下管状大π键内部
            // 上侧电子：左氧与右氧的上电子
            gsap.to(oLeftOrbits.e_py1.position, {x: 2.1, y: 3.4, z: 0, duration: 1.5}); // world: x=-1.5, y=3.4
            gsap.to(oRightOrbits.e_py1.position, {x: -2.1, y: 3.4, z: 0, duration: 1.5});// world: x=1.5, y=3.4
            // 下侧电子：碳的下电子与右氧的下电子
            gsap.to(cElecPy.position, {x: -1.5, y: -3.4, z: 0, duration: 1.5});
            gsap.to(oRightOrbits.e_py2.position, {x: -2.1, y: -3.4, z: 0, duration: 1.5});

            btnPi1.disabled = true; btnPi2.disabled = false;
        });

        btnPi2.addEventListener('click', () => {
            currentStep = 5;
            // 三个原子的 Pz 轨道全部消失，形成第二条离域大π键
            gsap.to([cMat.pz, oLMat.pz, oRMat.pz], { opacity: 0, duration: 1 });
            
            piBondHorizontal.visible = true;
            gsap.to(piHorizMat, { opacity: 0.85, duration: 1.5 });

            // 4个原Pz电子分别进入前后管状大π键内部
            // 前侧电子：左氧前电子与碳电子
            gsap.to(oLeftOrbits.e_pz1.position, {x: 2.1, y: 0, z: 3.4, duration: 1.5});
            gsap.to(cElec2s_2.position, {x: 1.5, y: 0, z: 3.4, duration: 1.5});
            // 后侧电子：左氧后电子与右氧后电子
            gsap.to(oLeftOrbits.e_pz2.position, {x: 2.1, y: 0, z: -3.4, duration: 1.5});
            gsap.to(oRightOrbits.e_pz1.position, {x: -2.1, y: 0, z: -3.4, duration: 1.5});

            btnPi2.disabled = true;
        });

        // ================= 上一步功能实现 =================
        btnReset.addEventListener('click', () => {
            if (currentStep === 0) {
                location.reload(); 
                return;
            }
            if (currentStep === 1) { // 撤销激发
                gsap.to(cElec2s_2.position, { x: -0.5, y: -0.4, z: 0, duration: 1 });
                btnExcite.disabled = false; btnHybridize.disabled = true;
                currentStep = 0;
            } else if (currentStep === 2) { // 撤销杂化
                gsap.to([cMat.s, cMat.px], { opacity: 0.8, duration: 1 });
                c2sLobe.visible = true; cPxLobe1.visible = true; cPxLobe2.visible = true;
                gsap.to(cMat.sp, { opacity: 0, duration: 1, onComplete: () => {
                    cSpLobeLeft.visible = false; cSpLobeRight.visible = false;
                }});
                gsap.to(cElec2s_1.position, { x: 0.5, y: 0.4, z: 0, duration: 1});
                gsap.to(cElecPx.position, { x: elecDist, y: 0, z: 0, duration: 1});
                btnHybridize.disabled = false; btnSigma.disabled = true;
                currentStep = 1;
            } else if (currentStep === 3) { // 撤销Sigma键
                gsap.to([cMat.sp, oLMat.px, oRMat.px], { opacity: 0.8, duration: 1 });
                gsap.to([sigmaLMat, sigmaRMat], { opacity: 0, duration: 1, onComplete: () => {
                    sigmaLeft.visible = false; sigmaRight.visible = false;
                }});
                gsap.to(cElec2s_1.position, {x: -1.4, y: 0, z: 0, duration: 1});
                gsap.to(cElecPx.position, {x: 1.4, y: 0, z: 0, duration: 1});
                gsap.to(oLeftOrbits.elecPx.position, {x: elecDist, y: 0, z: 0, duration: 1});
                gsap.to(oRightOrbits.elecPx.position, {x: -elecDist, y: 0, z: 0, duration: 1});
                gsap.to(oRightOrbits.e_pz1.position, {z: elecDist, duration: 1}); // 右氧Pz电子回归前侧
                btnSigma.disabled = false; btnPi1.disabled = true;
                currentStep = 2;
            } else if (currentStep === 4) { // 撤销第1次Pi键
                gsap.to([cMat.py, oLMat.py, oRMat.py], { opacity: 0.8, duration: 1 });
                gsap.to(piVertMat, { opacity: 0, duration: 1, onComplete: () => {
                    piBondVertical.visible = false;
                }});
                gsap.to(cElecPy.position, {x: 0, y: -elecDist, z: 0, duration: 1});
                gsap.to(oLeftOrbits.e_py1.position, {x: 0, y: elecDist, z: 0, duration: 1});
                gsap.to(oRightOrbits.e_py1.position, {x: 0, y: elecDist, z: 0, duration: 1});
                gsap.to(oRightOrbits.e_py2.position, {x: 0, y: -elecDist, z: 0, duration: 1});
                btnPi1.disabled = false; btnPi2.disabled = true;
                currentStep = 3;
            } else if (currentStep === 5) { // 撤销第2次Pi键
                gsap.to([cMat.pz, oLMat.pz, oRMat.pz], { opacity: 0.8, duration: 1 });
                gsap.to(piHorizMat, { opacity: 0, duration: 1, onComplete: () => {
                    piBondHorizontal.visible = false;
                }});
                gsap.to(cElec2s_2.position, {x: 0, y: 0, z: elecDist, duration: 1});
                gsap.to(oLeftOrbits.e_pz1.position, {x: 0, y: 0, z: elecDist, duration: 1});
                gsap.to(oLeftOrbits.e_pz2.position, {x: 0, y: 0, z: -elecDist, duration: 1});
                gsap.to(oRightOrbits.e_pz1.position, {x: 0, y: 0, z: -elecDist, duration: 1});
                btnPi2.disabled = false;
                currentStep = 4;
            }
        });
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
