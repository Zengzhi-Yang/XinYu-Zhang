<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>3D 有机动画演示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 标题区域 */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    .header .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      font-weight: 400;
    }

    /* 控制区域 */
    .control-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label .icon {
      font-size: 20px;
    }

    .select-wrapper {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    select {
      width: 100%;
      font-size: 15px;
      padding: 14px 45px 14px 18px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      background: #fff;
      color: #333;
      cursor: pointer;
      appearance: none;
      transition: all 0.3s ease;
      outline: none;
    }

    select:hover {
      border-color: #667eea;
    }

    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
    }

    .select-wrapper::after {
      content: "▼";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #667eea;
      font-size: 12px;
      pointer-events: none;
    }

    /* 动画信息卡片 */
    .anim-info {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .info-tag {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      cursor: default;
    }

    .info-tag:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    }

    .info-tag .tag-icon {
      font-size: 14px;
    }

    /* iframe 容器 */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 70%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .iframe-wrapper:hover {
      box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* 底部提示 */
    .footer {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .footer a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      border-bottom: 1px dashed rgba(255,255,255,0.5);
      transition: all 0.3s ease;
    }

    .footer a:hover {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .control-card {
        padding: 20px;
        flex-direction: column;
        align-items: stretch;
      }

      .select-wrapper {
        min-width: 100%;
      }

      .iframe-wrapper {
        padding-bottom: 75%;
        border-radius: 16px;
      }
    }

    /* 加载动画 */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 10;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧪 3D 有机化学动画演示</h1>
      <p class="subtitle">交互式分子模型 · 动态反应机理 · 可视化学习体验</p>
    </div>

    <div class="control-card">
      <div class="control-label">
        <span class="icon">🎯</span>
        <span>选择动画</span>
      </div>
      <div class="select-wrapper">
        <select id="anim-select">
          <option value="isopropyl-cyclopropane.html">异丙基环丙烷 3D 反应机理教学</option>
          <option value="co2.html">二氧化碳杂化与成键教学</option>
          <option value="styrene.html">苯乙烯共线共面教学</option>
        </select>
      </div>
      <div class="anim-info" id="anim-info">
        <span class="info-tag" id="tag-type">
          <span class="tag-icon">⚡</span>
          <span>反应机理</span>
        </span>
        <span class="info-tag" id="tag-topic">
          <span class="tag-icon">📚</span>
          <span>亲核加成</span>
        </span>
      </div>
    </div>

    <div class="iframe-wrapper">
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
      </div>
      <iframe id="anim-iframe" src="isopropyl-cyclopropane.html" onload="hideLoading()"></iframe>
    </div>

    <div class="footer">
      <p>💡 操作提示：左键拖动旋转视角 | 按住 Ctrl+左键平移位置 | 滚轮缩放大小</p>
    </div>
  </div>

  <script>
    const select = document.getElementById('anim-select');
    const iframe = document.getElementById('anim-iframe');
    const loading = document.getElementById('loading');
    const tagType = document.getElementById('tag-type');
    const tagTopic = document.getElementById('tag-topic');

    // 动画信息配置
    const animInfo = {
      'isopropyl-cyclopropane.html': {
        type: { icon: '⚡', text: '反应机理' },
        topic: { icon: '📚', text: '亲核加成' }
      },
      'co2.html': {
        type: { icon: '🔬', text: '杂化轨道' },
        topic: { icon: '🧪', text: 'π键形成' }
      },
      'styrene.html': {
        type: { icon: '📐', text: '空间构型' },
        topic: { icon: '🔗', text: '共线共面' }
      }
    };

    function hideLoading() {
      loading.classList.add('hidden');
    }

    function showLoading() {
      loading.classList.remove('hidden');
    }

    function updateInfo(filename) {
      const info = animInfo[filename];
      if (info) {
        tagType.querySelector('span:last-child').textContent = info.type.text;
        tagType.querySelector('.tag-icon').textContent = info.type.icon;
        tagTopic.querySelector('span:last-child').textContent = info.topic.text;
        tagTopic.querySelector('.tag-icon').textContent = info.topic.icon;
      }
    }

    function switchAnimation() {
      const url = select.value;
      showLoading();
      iframe.src = url;
      updateInfo(url);
    }

    select.addEventListener('change', switchAnimation);

    // 初始化信息
    updateInfo(select.value);
  </script>
</body>
</html>
